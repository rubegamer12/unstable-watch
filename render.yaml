services:
  - type: web
    name: unstable-watch
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: DATA_DIR
        value: /var/data
      - key: POLL_INTERVAL_MS
        value: 120000
      - key: DISCORD_BOT_MODE
        value: local
      - key: NODE_ENV
        value: production
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: DISCORD_INVITE
        value: https://discord.gg/unstableevents
      - key: DISCORD_MESSAGE_CONTENT_INTENT
        value: "false"
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      # YOUTUBE_API_KEY is optional; add it in the host dashboard for a deeper archive.
      # VAPID keys are generated once and saved on the persistent disk by default.
    disk:
      name: unstable-watch-data
      mountPath: /var/data
      sizeGB: 1

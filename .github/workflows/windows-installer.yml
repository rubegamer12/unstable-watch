name: Build Windows installer

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Build NSIS installer
        run: npm run desktop:dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unstable-Watch-Windows
          path: dist/Unstable-Watch-Setup-*.exe
          if-no-files-found: error

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish installer to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $installer = Get-ChildItem "dist/Unstable-Watch-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not created" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer.FullName --title "Unstable Watch $tag" --notes "Automated Windows installer build from main."
          } else {
            gh release upload $tag $installer.FullName --clobber
          }


